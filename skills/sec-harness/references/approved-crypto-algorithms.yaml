# Approved cryptography policy (F13) — machine-checked by sec_harness.crypto_policy.
approved:
  - aes-256-gcm
  - chacha20-poly1305
  - sha256
  - sha384
  - sha512
  - argon2
  - bcrypt
  - scrypt
  - pbkdf2
denied:
  - md5
  - sha1
  - des
  - 3des
  - rc4
  - ecb
  - rijndael-ctr-nomac
floors:
  - rsa>=3072
  - pbkdf2>=600000  # OWASP Password Storage Cheat Sheet, PBKDF2-HMAC-SHA256 (checked 2026-08-04)
  - ecc>=256
  - aes>=128
